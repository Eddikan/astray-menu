name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Create the Pages project on first run (ignored if it already exists)
          npx --yes wrangler@3 pages project create astray-menu \
            --production-branch=main 2>/dev/null || true
          # Deploy the repo root to production
          npx --yes wrangler@3 pages deploy . \
            --project-name=astray-menu \
            --branch=main
